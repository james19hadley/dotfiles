# Application bindings
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" tmux new
$terminal = uwsm app -- $TERMINAL
$browser = omarchy-launch-browser

bindd = SUPER, return, Terminal, exec, $terminal --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER, F, File manager, exec, uwsm app -- nautilus --new-window
bindd = SUPER, B, Browser, exec, $browser
bindd = SUPER SHIFT, B, Browser (private), exec, $browser --private
bindd = SUPER, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER, N, Editor, exec, omarchy-launch-editor
bindd = SUPER, T, Activity, exec, omarchy-launch-tui btop
bindd = SUPER, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER, G, Signal, exec, omarchy-launch-or-focus signal "uwsm app -- signal-desktop"
bindd = SUPER, O, Obsidian, exec, omarchy-launch-or-focus obsidian "uwsm-app -- obsidian"
bindd = SUPER, slash, Passwords, exec, uwsm app -- 1password
unbind = SUPER, P
bindd = SUPER, P, Display switcher, exec, ~/.local/bin/omarchy-menu-display

# If your web app url contains #, type it as ## to prevent hyperland treat it as comments
bindd = SUPER, A, FICSIT ADA Assistant, exec, /home/ging/.local/bin/ada look
bindd = SUPER SHIFT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
bindd = SUPER, C, Calendar, exec, omarchy-launch-webapp "https://app.hey.com/calendar/weeks/"
bindd = SUPER, E, Email, exec, omarchy-launch-webapp "https://app.hey.com"
bindd = SUPER, Y, YouTube, exec, omarchy-launch-or-focus-webapp YouTube "https://youtube.com/"
bindd = SUPER SHIFT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
bindd = SUPER ALT, G, Google Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
bindd = SUPER, X, X, exec, omarchy-launch-webapp "https://x.com/"
bindd = SUPER SHIFT, X, X Post, exec, omarchy-launch-webapp "https://x.com/compose/post"

# Workspace switches
bind = SUPER, TAB, workspace, previous
bind = SUPER ALT, Right, workspace, r+1     # Next active workspace
bind = SUPER ALT, L, workspace, r+1         # Next active workspace
bind = SUPER ALT, Left, workspace, r-1      # Previous active workspace
bind = SUPER ALT, H, workspace, r-1         # Previous active workspace

bind = SUPER ALT SHIFT, Right, movetoworkspace, r+1     # Next active workspace
bind = SUPER ALT SHIFT, L, movetoworkspace, r+1         # Next active workspace
bind = SUPER ALT SHIFT, Left, movetoworkspace, r-1      # Previous active workspace
bind = SUPER ALT SHIFT, H, movetoworkspace, r-1         # Previous active workspace

# Screenshots
# Fullscreen screenshot directly to clipboard
bindd = CTRL, PRINT, Fullscreen screenshot to clipboard, exec, bash -c "grim - | wl-copy && notify-send -u low '📸 Screenshot copied to clipboard'"

# Application launcher on single Super tap (triggers on release only if no other key was pressed)
unbind = SUPER, SPACE
bindr = SUPER, SUPER_L, exec, omarchy-launch-walker

# Mouse keyboard mod
$mouse_mod = CTRL ALT
$mouse_speed = 15

# Movemnents
binde = $mouse_mod, L, exec, ydotool mousemove --relative -- $mouse_speed 0
binde = $mouse_mod, H, exec, ydotool mousemove --relative -- -$mouse_speed 0
binde = $mouse_mod, K, exec, ydotool mousemove --relative -- 0 -$mouse_speed
binde = $mouse_mod, J, exec, ydotool mousemove --relative -- 0 $mouse_speed

# Diagonal
binde = $mouse_mod, Y, exec, ydotool mousemove --relative -- -$mouse_speed -$mouse_speed
binde = $mouse_mod, O, exec, ydotool mousemove --relative -- $mouse_speed -$mouse_speed
binde = $mouse_mod, B, exec, ydotool mousemove --relative -- -$mouse_speed $mouse_speed
binde = $mouse_mod, slash, exec, ydotool mousemove --relative -- $mouse_speed $mouse_speed



bind = $mouse_mod, N, exec, ydotool key 272:1 272:0      # Left click
bind = $mouse_mod, M, exec, ydotool key 274:1 274:0      # Middle click (paste)
bind = $mouse_mod, comma, exec, ydotool key 273:1 273:0   # Right click

binde = $mouse_mod, U, exec, bash -c "ydotool scroll -- -15 0"    # Scroll UP
binde = $mouse_mod, I, exec, bash -c "ydotool scroll -- 15 0"     # Scroll DOWN

# Decrease warmth / make cooler (F6 - left)
bind = SUPER, F6, exec, omarchy-sunset cooler

# Increase warmth / make warmer (F7 - right)
bind = SUPER, F7, exec, omarchy-sunset warmer

# Set warm mode / restore last saved temperature
bind = SUPER, F8, exec, omarchy-sunset warm

# Reset screen color temperature to default (6500K daylight)
bind = SUPER, F9, exec, omarchy-sunset reset


