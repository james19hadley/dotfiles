# Monitor configuration
# See https://wiki.hyprland.org/Configuring/Monitors/

env = GDK_SCALE,1

# Built-in laptop display:
monitor = eDP-1, preferred, 0x0, 1.25

# Universal rule for ANY connected external display (HDMI, DP, Type-C, etc.):
# Auto-detects native resolution and highest refresh rate, positioned cleanly:
monitor = , preferred, auto-right, 1
